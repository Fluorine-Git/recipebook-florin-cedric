{% extends "recipes.html" %}
{% block body %}
    <h2>Recipes Available</h2>
    <ul>
        {% for recipe in recipes %}
        <li> <a href="{{ recipe.get_absolute_url }}"> {{ recipe.name }} </a> </li>
        {% endfor %}
    </ul>
    <a href="/recipe/add">Create a new recipe</a>
{% endblock %}
